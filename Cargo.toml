[package]
name = "codex-cli-editor"
version = "0.2.1"
default-run = "codex-cli-editor"
edition = "2024"
license = "Apache-2.0"
description = "Codex CLI Editor turns Codex terminals into chat-style editors with smart clipboard paste and familiar shortcuts"
repository = "https://github.com/AsadSaleemQ/codex-cli-editor"
rust-version = "1.95"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std", "zeroize"] }
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
fs2 = "0.4"
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "consoleapi",
    "fileapi",
    "handleapi",
    "jobapi2",
    "processthreadsapi",
    "synchapi",
    "wincon",
    "winbase",
    "winnt",
    "winreg",
    "winuser",
] }
[dev-dependencies]
pretty_assertions = "1"
