name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce public repository boundary
        shell: pwsh
        run: ./scripts/check_publication_candidate.ps1
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_1.7.12_linux_amd64.tar.gz"
          binary="${RUNNER_TEMP}/actionlint"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" actionlint
          "${binary}" -no-color
  dispatcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
      - name: Test deterministic VS Code bridge
        shell: pwsh
        run: |
          node vscode-extension/extension.test.js
          .\scripts\build_vscode_extension.ps1 -OutputPath "$env:RUNNER_TEMP\bridge-a.vsix"
          .\scripts\build_vscode_extension.ps1 -OutputPath "$env:RUNNER_TEMP\bridge-b.vsix"
          if ((Get-FileHash "$env:RUNNER_TEMP\bridge-a.vsix").Hash -ne (Get-FileHash "$env:RUNNER_TEMP\bridge-b.vsix").Hash) { throw 'VSIX build is not reproducible' }
      - name: Format
        run: cargo +1.95.0-x86_64-pc-windows-msvc fmt --all -- --check
      - name: Clippy
        run: cargo +1.95.0-x86_64-pc-windows-msvc clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.95.0-x86_64-pc-windows-msvc test --locked -j 1
      - name: Release build
        run: cargo +1.95.0-x86_64-pc-windows-msvc build --locked --release --bins
      - name: Exercise isolated release finalizer
        shell: pwsh
        run: .\scripts\check_release_finalizer.ps1 -SignerPath target\release\sign_release.exe

  patch:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: codex-patch-6b9826e3aa83b1a5947db50f4332cb9c65f1b340-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check patch against pinned upstream
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'codex-upstream'
          $patch = "$env:GITHUB_WORKSPACE\patches\codex\rust-v0.154.0\0001-desktop-composer.patch"
          $expected = 'f42586812a8e19b2d0b259382949e406ae9902a9319920fa6b8d705f9c7c4b96'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash.ToLowerInvariant() -ne $expected) { throw 'patch hash mismatch' }
          git clone --filter=blob:none https://github.com/openai/codex.git $upstream
          git -C $upstream checkout 6b9826e3aa83b1a5947db50f4332cb9c65f1b340
          git -C $upstream apply --check "$env:GITHUB_WORKSPACE\patches\codex\rust-v0.154.0\0001-desktop-composer.patch"
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt
      - name: Validate pinned upstream lock refresh
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'codex-upstream'
          .\scripts\refresh_codex_lock.ps1 -UpstreamRoot $upstream
      - name: Verify clean unpatched Windows baseline
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'codex-upstream'
          .\scripts\check_codex_tui_baseline.ps1 -UpstreamRoot $upstream
      - name: Apply and validate patch
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'codex-upstream'
          $patch = "$env:GITHUB_WORKSPACE\patches\codex\rust-v0.154.0\0001-desktop-composer.patch"
          git -C $upstream apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'patch application failed' }
          git -C $upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw 'patched tree has whitespace errors' }
          $bridge = Join-Path $upstream 'codex-rs\tui\src\vscode_bridge.rs'
          $textarea = Join-Path $upstream 'codex-rs\tui\src\bottom_pane\textarea.rs'
          if (-not (Test-Path -LiteralPath $bridge -PathType Leaf)) { throw 'patched VS Code bridge source is missing' }
          if (-not (Select-String -LiteralPath $textarea -SimpleMatch 'fn control_home_end_and_shift_variants_use_document_boundaries' -Quiet)) { throw 'patched boundary-key regression test is missing' }
          $manifest = Join-Path $upstream 'codex-rs\Cargo.toml'
          cargo +1.95.0-x86_64-pc-windows-msvc clean --manifest-path $manifest -p codex-tui
          if ($LASTEXITCODE -ne 0) { throw 'unable to invalidate the clean-baseline codex-tui artifacts' }
      - name: Probe required code-mode host package
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'codex-upstream'
          .\scripts\prepare_i18n_embed_fl.ps1 `
            -UpstreamRoot $upstream `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'deterministic-dependency')
          $v8 = .\scripts\prepare_rusty_v8.ps1 `
            -UpstreamRoot $upstream `
            -DestinationRoot (Join-Path $env:RUNNER_TEMP 'rusty-v8')
          $env:RUSTY_V8_ARCHIVE = $v8.ArchivePath
          $env:RUSTY_V8_SRC_BINDING_PATH = $v8.BindingPath
          $manifest = Join-Path $upstream 'codex-rs\Cargo.toml'
          cargo +1.95.0-x86_64-pc-windows-msvc check --locked --manifest-path $manifest -p codex-code-mode-host
      - name: Compare full patched TUI suite with unpatched Windows baseline
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'codex-upstream'
          .\scripts\check_codex_tui_baseline.ps1 -UpstreamRoot $upstream -ExpectedPassed 4259
